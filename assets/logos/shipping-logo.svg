  <!-- Coque -->
  <path d="M70 88h184l-22 38H96z" fill="url(#shg1)"/>
  <path d="M70 88h184l-4 7H74z" fill="#F39C1E"/>
  <!-- Mer -->
  <path d="M52 140c14 0 14-8 28-8s14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8 14-8 28-8 14 8 28 8" fill="none" stroke="url(#shg3)" stroke-width="6" stroke-linecap="round"/>
  <text x="160" y="186" text-anchor="middle" font-family="Montserrat,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#0D2C66" letter-spacing="2">SHIPPING</text>
</svg>
