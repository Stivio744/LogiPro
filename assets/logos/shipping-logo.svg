    <linearGradient id="shg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7B85A"/><stop offset="1" stop-color="#F39C1E"/></linearGradient>
    <linearGradient id="shg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FA7D6"/><stop offset="1" stop-color="#0E6BA8"/></linearGradient>
  </defs>
  <rect width="320" height="200" fill="#fff"/>
