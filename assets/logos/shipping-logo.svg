  <rect x="104" y="58" width="34" height="26" rx="2" fill="url(#shg2)"/><rect x="142" y="58" width="34" height="26" rx="2" fill="url(#shg2)"/>
  <rect x="123" y="34" width="34" height="22" rx="2" fill="url(#shg2)"/>
