<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Gestion de Yard — Dépôt de conteneurs">
  <defs>
    <linearGradient id="ydg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F6FC9"/><stop offset="1" stop-color="#1F4E96"/></linearGradient>
    <linearGradient id="ydg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7B85A"/><stop offset="1" stop-color="#E08A12"/></linearGradient>
    <linearGradient id="ydg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D2513F"/><stop offset="1" stop-color="#A8321F"/></linearGradient>
    <linearGradient id="ydg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C230"/><stop offset="1" stop-color="#D9A40F"/></linearGradient>
    <pattern id="ydr" width="6" height="10" patternUnits="userSpaceOnUse"><rect width="6" height="10" fill="none"/><rect x="0" width="1.4" height="10" fill="#000" opacity=".16"/></pattern>
  </defs>
  <rect width="320" height="200" fill="#fff"/>
  <!-- Sol du yard et marquage -->
  <path d="M40 132h240l-14 14H54z" fill="#E5E9EF"/><path d="M70 139h20M110 139h20M150 139h20M190 139h20M230 139h20" stroke="#fff" stroke-width="2.5"/>
  <!-- Pile de conteneurs (3 niveaux) -->
  <g>
    <rect x="58" y="104" width="62" height="28" rx="2" fill="url(#ydg1)"/><rect x="58" y="104" width="62" height="28" rx="2" fill="url(#ydr)"/>
    <rect x="122" y="104" width="62" height="28" rx="2" fill="url(#ydg3)"/><rect x="122" y="104" width="62" height="28" rx="2" fill="url(#ydr)"/>
    <rect x="72" y="74" width="62" height="28" rx="2" fill="url(#ydg2)"/><rect x="72" y="74" width="62" height="28" rx="2" fill="url(#ydr)"/>
    <rect x="96" y="44" width="62" height="28" rx="2" fill="#2E8B57"/><rect x="96" y="44" width="62" height="28" rx="2" fill="url(#ydr)"/>
  </g>
  <!-- Reach stacker -->
  <g>
    <path d="M206 104h52l8 14v14h-60z" fill="url(#ydg4)"/><rect x="214" y="88" width="20" height="18" rx="3" fill="#1F2937"/><rect x="217" y="91" width="14" height="9" rx="1.5" fill="#BFE3F7"/>
    <path d="M236 108L174 50l8-6 64 58z" fill="url(#ydg4)"/><rect x="160" y="40" width="30" height="7" rx="2" fill="#1F2937"/>
    <circle cx="218" cy="134" r="9" fill="#1F2937"/><circle cx="218" cy="134" r="3.5" fill="#9CA3AF"/><circle cx="254" cy="134" r="9" fill="#1F2937"/><circle cx="254" cy="134" r="3.5" fill="#9CA3AF"/>
  </g>
  <text x="160" y="176" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="25" fill="#0D2C66" letter-spacing="1">GESTION DE YARD</text>
  <text x="160" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="#B45309" letter-spacing="2.4">DÉPÔT DE CONTENEURS</text>
